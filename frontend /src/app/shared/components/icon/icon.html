<svg class="icon__svg" viewBox="0 0 24 24" aria-hidden="true">
  @switch (name()) {
    @case ('close') {
      <svg:line x1="6" y1="6" x2="18" y2="18" />
      <svg:line x1="18" y1="6" x2="6" y2="18" />
    }
    @case ('search') {
      <svg:circle cx="11" cy="11" r="7" />
      <svg:line x1="16.5" y1="16.5" x2="21" y2="21" />
    }
    @case ('trash') {
      <svg:polyline points="4 7 20 7" />
      <svg:path d="M9 7V4h6v3" />
      <svg:path d="M6 7l1 13h10l1-13" />
      <svg:line x1="10" y1="11" x2="10" y2="16" />
      <svg:line x1="14" y1="11" x2="14" y2="16" />
    }
    @case ('clock') {
      <svg:circle cx="12" cy="12" r="9" />
      <svg:polyline points="12 7 12 12 15 14" />
    }
  }
</svg>
